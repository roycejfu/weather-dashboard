<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>南向资金历史报告 · 2026</title>
<style>
  :root {
    --font-sans: -apple-system, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
    --bg: #f5f7fa;
    --card-bg: #ffffff;
    --card-bg-secondary: #fafafa;
    --text: #1a1a1a;
    --text-secondary: #636363;
    --text-tertiary: #939393;
    --border: #e8e8ea;
    --red: #C0392B;
    --green: #2D7D3A;
    --red-bg: #FDEDEC;
    --green-bg: #E8F5E9;
    --radius: 12px;
    --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text);
    padding: 0;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* Navigation */
  .nav {
    background: #1a1a2e;
    padding: 0 24px;
    display: flex;
    align-items: center;
    gap: 8px;
    height: 48px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .nav a {
    color: #b0b0c0;
    text-decoration: none;
    font-size: 13px;
    padding: 6px 14px;
    border-radius: 6px;
    transition: all 0.2s;
  }
  .nav a:hover, .nav a.active { color: #fff; background: rgba(255,255,255,0.1); }
  .nav .brand { color: #fff; font-weight: 600; font-size: 15px; margin-right: auto; }

  .container { max-width: 1200px; margin: 0 auto; padding: 24px; }

  /* Header */
  .header { margin-bottom: 28px; }
  .header h1 { font-size: 26px; font-weight: 600; margin-bottom: 4px; }
  .header .sub { color: var(--text-secondary); font-size: 14px; }
  .header .sub span { color: var(--text); font-weight: 500; }

  /* Stats bar */
  .stats-bar {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
  }
  .stat-card .label { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
  .stat-card .value { font-size: 24px; font-weight: 600; }
  .stat-card .detail { font-size: 11px; color: var(--text-tertiary); margin-top: 4px; }

  /* Chart card */
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 24px;
    margin-bottom: 20px;
  }
  .card h2 { font-size: 16px; font-weight: 600; margin-bottom: 16px; color: var(--text); }

  .chart-wrap { position: relative; height: 320px; }
  .chart-legend { display: flex; gap: 20px; margin-bottom: 12px; font-size: 12px; color: var(--text-secondary); }
  .legend-dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: middle; }

  /* Month selector */
  .month-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px;
    margin-bottom: 24px;
  }
  .month-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    cursor: pointer;
    transition: all 0.15s;
    text-decoration: none;
    color: inherit;
    display: block;
  }
  .month-card:hover { border-color: #bbb; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .month-card.selected { border-color: #4a6cf7; background: #f0f3ff; }
  .month-card .m-name { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  .month-card .m-flow { font-size: 18px; font-weight: 600; }
  .month-card .m-days { font-size: 11px; color: var(--text-tertiary); margin-top: 2px; }

  /* Daily report list */
  .report-list { display: flex; flex-direction: column; gap: 12px; }

  /* Collapsible date section */
  .date-section { margin-bottom: 8px; }
  .date-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px 18px;
    cursor: pointer;
    transition: background 0.15s;
    user-select: none;
  }
  .date-header:hover { background: var(--card-bg-secondary); }
  .date-header .d-left { display: flex; align-items: center; gap: 12px; }
  .date-header .d-date { font-weight: 600; font-size: 15px; }
  .date-header .d-day { font-size: 12px; color: var(--text-secondary); }
  .date-header .d-flow { font-size: 16px; font-weight: 600; }
  .date-header .d-arrow { font-size: 12px; color: var(--text-tertiary); transition: transform 0.2s; }
  .date-header.open .d-arrow { transform: rotate(180deg); }

  .date-detail {
    display: none;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 var(--radius-sm) var(--radius-sm);
    padding: 0 18px 14px;
    margin-top: -1px;
  }
  .date-detail.open { display: block; }

  .detail-row { display: flex; gap: 8px; margin-bottom: 8px; font-size: 13px; }
  .detail-row .d-label { color: var(--text-secondary); min-width: 80px; flex-shrink: 0; }
  .detail-row .d-val { color: var(--text); }

  /* Mini stock table in detail */
  .mini-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
  .mini-table th {
    text-align: left;
    padding: 6px 8px;
    font-weight: 500;
    font-size: 11px;
    color: var(--text-secondary);
    border-bottom: 1px solid var(--border);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .mini-table td { padding: 5px 8px; border-bottom: 1px solid #f0f0f2; font-size: 13px; }
  .mini-table tr:last-child td { border-bottom: none; }
  .mini-table .stock-code { color: var(--text-tertiary); font-size: 12px; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; }

  /* Commentary */
  .commentary {
    background: #FFF9E6;
    border: 1px solid #F0D77B;
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    margin-top: 12px;
    font-size: 13px;
    color: #5D4E1B;
    line-height: 1.6;
  }

  /* Footer */
  .footer { text-align: center; padding: 32px 0; color: var(--text-tertiary); font-size: 12px; }
  .footer a { color: var(--text-secondary); }
  .no-data { text-align: center; color: var(--text-tertiary); padding: 24px; font-size: 14px; }

  @media (max-width: 768px) {
    .stats-bar { grid-template-columns: repeat(2, 1fr); }
    .month-grid { grid-template-columns: repeat(3, 1fr); }
    .container { padding: 16px; }
  }
</style>
</head>
<body>

<nav class="nav">
  <span class="brand">南向资金看板</span>
  <a href="southbound.html">实时看板</a>
  <a href="history.html" class="active">历史报告</a>
</nav>

<div class="container">

<div class="header">
  <h1>2026年南向资金历史报告</h1>
  <p class="sub">数据区间 1月2日 — <span id="latestDate">--</span> · 共 <span id="totalDays">--</span> 个交易日 · 数据来源：东方财富</p>
</div>

<div class="stats-bar" id="statsBar"></div>

<div class="card">
  <h2>全年每日净买入额</h2>
  <div class="chart-legend">
    <span><span class="legend-dot" style="background:var(--red)"></span>净流入</span>
    <span><span class="legend-dot" style="background:var(--green)"></span>净流出</span>
  </div>
  <div class="chart-wrap"><canvas id="yearChart"></canvas></div>
  <div style="font-size:11px;color:var(--text-tertiary);margin-top:10px;">1月—4月22日为月度估算值，4月23日起为逐日精确数据</div>
</div>

<div class="card">
  <h2>按月查看</h2>
  <div class="month-grid" id="monthGrid"></div>
</div>

<div class="card">
  <h2 id="listTitle">每日报告</h2>
  <div class="report-list" id="reportList"></div>
</div>

</div>

<div class="footer">
  <p>数据来源：<a href="https://data.eastmoney.com/hsgtcg/" target="_blank" rel="noopener">东方财富数据中心</a> · Auto-generated by WorkBuddy</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
Chart.defaults.font.family = getComputedStyle(document.documentElement).getPropertyValue('--font-sans');
Chart.defaults.font.size = 11;

const red = getComputedStyle(document.documentElement).getPropertyValue('--red').trim();
const green = getComputedStyle(document.documentElement).getPropertyValue('--green').trim();

async function loadData() {
  try {
    const resp = await fetch('southbound_data.json?t=' + Date.now());
    return await resp.json();
  } catch(e) {
    // Fallback: try from same origin absolute
    const resp2 = await fetch('/weather-dashboard/southbound_data.json?t=' + Date.now());
    return await resp2.json();
  }
}

function formatFlow(v) {
  const s = (v >= 0 ? '+' : '') + v.toFixed(2);
  return s;
}

function flowColor(v) {
  return v >= 0 ? red : green;
}

function renderStats(data) {
  const reports = data.reports;
  if (!reports.length) return;

  const latest = reports[reports.length - 1];
  document.getElementById('latestDate').textContent = latest.date;
  document.getElementById('totalDays').textContent = reports.length;

  // Cumulative stats
  const totalInflow = reports.filter(r => r.total_net > 0).reduce((s, r) => s + r.total_net, 0);
  const totalOutflow = reports.filter(r => r.total_net < 0).reduce((s, r) => s + Math.abs(r.total_net), 0);
  const netFlow = reports.reduce((s, r) => s + r.total_net, 0);
  const maxInflow = Math.max(...reports.map(r => r.total_net));
  const maxOutflow = Math.min(...reports.map(r => r.total_net));
  const avgFlow = netFlow / reports.length;

  const col = (v) => v >= 0 ? red : green;
  const fmt = (v) => (v >= 0 ? '+' : '') + v.toFixed(1) + ' 亿';

  document.getElementById('statsBar').innerHTML = `
    <div class="stat-card">
      <div class="label">累计净流向</div>
      <div class="value" style="color:${col(netFlow)}">${fmt(netFlow)}</div>
      <div class="detail">流入 ${totalInflow.toFixed(0)}亿 / 流出 ${totalOutflow.toFixed(0)}亿</div>
    </div>
    <div class="stat-card">
      <div class="label">最新交易日</div>
      <div class="value" style="color:${col(latest.total_net)}">${fmt(latest.total_net)}</div>
      <div class="detail">${latest.date}</div>
    </div>
    <div class="stat-card">
      <div class="label">日均净流向</div>
      <div class="value" style="color:${col(avgFlow)}">${fmt(avgFlow)}</div>
      <div class="detail">${reports.length} 个交易日</div>
    </div>
    <div class="stat-card">
      <div class="label">极值</div>
      <div class="value"><span style="color:${red};font-size:16px;">↑ ${maxInflow.toFixed(0)}亿</span> / <span style="color:${green};font-size:16px;">↓ ${Math.abs(maxOutflow).toFixed(0)}亿</span></div>
      <div class="detail">单日最大净流入/流出</div>
    </div>
  `;
}

let yearChart = null;

function renderYearChart(data) {
  const ctx = document.getElementById('yearChart').getContext('2d');
  const labels = data.daily_chart.labels;
  const values = data.daily_chart.values;

  if (yearChart) yearChart.destroy();

  yearChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [{
        data: values,
        backgroundColor: values.map(v => v >= 0 ? red : green),
        borderRadius: 1,
        barPercentage: 0.9,
        categoryPercentage: 1
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            title: items => '2026-' + items[0].label,
            label: ctx => formatFlow(ctx.raw) + ' 亿港元'
          }
        }
      },
      scales: {
        x: {
          grid: { display: false },
          ticks: {
            color: '#939393',
            autoSkip: true,
            maxRotation: 90,
            minRotation: 90,
            font: { size: 9 },
            maxTicksLimit: 30
          }
        },
        y: {
          grid: { color: 'rgba(0,0,0,0.05)' },
          ticks: { color: '#939393', callback: v => v + '亿' },
          min: Math.min(-350, Math.floor(Math.min(...values) / 50) * 50 - 50),
          max: Math.max(450, Math.ceil(Math.max(...values) / 50) * 50 + 50)
        }
      }
    }
  });
}

const WEEKDAYS = ['日', '一', '二', '三', '四', '五', '六'];

function renderMonthGrid(data) {
  const reports = data.reports;
  const months = {};
  reports.forEach(r => {
    const m = r.date.substring(0, 7);
    if (!months[m]) months[m] = { total: 0, days: 0, reports: [] };
    months[m].total += r.total_net;
    months[m].days++;
    months[m].reports.push(r);
  });

  const grid = document.getElementById('monthGrid');
  const keys = Object.keys(months);

  grid.innerHTML = keys.map((m, i) => {
    const mo = months[m];
    const mName = ['', '1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'][parseInt(m.split('-')[1])];
    return `<div class="month-card" data-month="${m}" onclick="filterMonth('${m}')">
      <div class="m-name">${mName}</div>
      <div class="m-flow" style="color:${flowColor(mo.total)}">${formatFlow(mo.total)} 亿</div>
      <div class="m-days">${mo.days} 个交易日</div>
    </div>`;
  }).join('');

  // Add "All" button
  grid.innerHTML = `<div class="month-card selected" data-month="all" onclick="filterMonth('all')">
    <div class="m-name">全年</div>
    <div class="m-flow" style="color:${flowColor(reports.reduce((s,r)=>s+r.total_net,0))}">${formatFlow(reports.reduce((s,r)=>s+r.total_net,0))} 亿</div>
    <div class="m-days">${reports.length} 个交易日</div>
  </div>` + grid.innerHTML;

  window._monthsData = months;
  window._allReports = reports;
}

let selectedMonth = 'all';

function filterMonth(month) {
  selectedMonth = month;
  document.querySelectorAll('.month-card').forEach(el => el.classList.remove('selected'));
  document.querySelector(`.month-card[data-month="${month}"]`)?.classList.add('selected');

  const reports = month === 'all'
    ? window._allReports
    : (window._monthsData[month]?.reports || []);

  renderReportList(reports, month === 'all' ? '每日报告' : month + ' 每日报告');
}

function renderReportList(reports, title) {
  document.getElementById('listTitle').textContent = title || '每日报告';
  const list = document.getElementById('reportList');

  if (!reports.length) {
    list.innerHTML = '<div class="no-data">暂无数据</div>';
    return;
  }

  // Show in reverse chronological order (latest first)
  const reversed = [...reports].reverse();

  list.innerHTML = reversed.map((r, idx) => {
    const d = new Date(r.date);
    const dayName = WEEKDAYS[d.getDay()];
    const hasDetail = r.top_buy || r.top_sell;
    const flowSign = r.total_net >= 0 ? '净流入' : '净流出';

    let detailHtml = '';
    if (hasDetail) {
      detailHtml = '<div class="detail-row"><span class="d-label">沪港通</span><span class="d-val">' + (r.sh_net != null ? formatFlow(r.sh_net) + ' 亿' : '--') + '</span></div>';
      detailHtml += '<div class="detail-row"><span class="d-label">深港通</span><span class="d-val">' + (r.sz_net != null ? formatFlow(r.sz_net) + ' 亿' : '--') + '</span></div>';

      if (r.top_buy && r.top_buy.length) {
        detailHtml += '<table class="mini-table"><tr><th>排名</th><th>股票</th><th>代码</th><th>净买入</th></tr>';
        detailHtml += r.top_buy.map((s, i) =>
          '<tr><td>' + s.rank + '</td><td>' + s.name + '</td><td class="stock-code">' + s.code + '</td><td style="color:' + red + '">+' + s.amount.toFixed(2) + ' 亿</td></tr>'
        ).join('');
        detailHtml += '</table>';
      } else {
        detailHtml += '<div style="font-size:12px;color:var(--text-tertiary);margin-top:6px;">当日十大成交个股数据暂未收录</div>';
      }

      if (r.top_sell && r.top_sell.length) {
        detailHtml += '<table class="mini-table"><tr><th>排名</th><th>股票</th><th>代码</th><th>净卖出</th></tr>';
        detailHtml += r.top_sell.map((s, i) =>
          '<tr><td>' + s.rank + '</td><td>' + s.name + '</td><td class="stock-code">' + s.code + '</td><td style="color:' + green + '">' + s.amount.toFixed(2) + ' 亿</td></tr>'
        ).join('');
        detailHtml += '</table>';
      }

      if (r.commentary) {
        detailHtml += '<div class="commentary">' + r.commentary + '</div>';
      }
    } else {
      detailHtml = '<div style="font-size:12px;color:var(--text-tertiary);padding:8px 0;">该日仅记录净流向汇总数据，无个股排名详情</div>';
    }

    const cellId = 'detail-' + r.date.replace(/-/g, '');
    return `<div class="date-section">
      <div class="date-header" onclick="document.getElementById('${cellId}').classList.toggle('open'); this.classList.toggle('open')">
        <div class="d-left">
          <span class="d-date">${r.date}</span>
          <span class="d-day">周${dayName}</span>
          ${hasDetail ? '<span class="tag" style="background:var(--red-bg);color:var(--red)">含个股排名</span>' : ''}
        </div>
        <div style="display:flex;align-items:center;gap:16px;">
          <span class="d-flow" style="color:${flowColor(r.total_net)}">${formatFlow(r.total_net)} 亿 <span style="font-size:12px;font-weight:400;">${flowSign}</span></span>
          <span class="d-arrow">▼</span>
        </div>
      </div>
      <div class="date-detail" id="${cellId}">
        ${detailHtml}
      </div>
    </div>`;
  }).join('');
}

// Init
(async function() {
  const data = await loadData();
  window._allReports = data.reports;
  renderStats(data);
  renderYearChart(data);
  renderMonthGrid(data);
  filterMonth('all');
})();
</script>

</body>
</html>
